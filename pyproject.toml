[project]
name = "btcliq"
version = "0.1.0"
description = "Live BTC chart with estimated liquidation levels from multi-exchange open interest"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
btcliq = "btcliq.app:main"
btcliq-trade = "btcliq.trade_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
btcliq = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
